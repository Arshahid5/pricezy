name: Build Pricezy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 🛡️ Wajib ditambahkan agar proses tidak terputus/timeout di tengah jalan

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: 4. Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 5. Decode Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > app/pricezy.jks

      - name: 6. Build Release Signed APK
        env:
          KEYSTORE_PATH: "pricezy.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pricezy-App-Release-Signed
          path: app/build/outputs/apk/release/*.apk